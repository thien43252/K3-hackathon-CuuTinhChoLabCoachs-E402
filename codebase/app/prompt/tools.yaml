# starter_v0 — tool declarations for Labcode Assistant Agent
# Tool names must stay in sync across:
#   this file -> tools/__init__.py (ALL_TOOLS) -> test_tools.py
#
# Lưu ý: user_id, group_id, lab_id được auto-resolve từ Discord context
# (discord_context.py) và inject vào system prompt — KHÔNG cần truyền tham số.

tools:
  # ---------------- Knowledge & Content Tools ----------------
  - name: get_lab_content
    description: >
      Lấy nội dung bài lab đã được Admin phân tích từ cache (kết quả clone repo + phân tích .md).
      Trả về mục tiêu bài lab (lab_objective), danh sách task, tiêu chí đánh giá (grading_rubrics),
      bẫy lỗi thường gặp (common_pitfalls), và danh sách tài liệu .md (sitemap).
    parameters:
      type: object
      properties:
        lab_id:
          type: string
          description: "Mã bài lab cần lấy nội dung (ví dụ: 'DAY05', 'LAB05_GROUP')."
      required: [lab_id]

  # ---------------- Platform & Context Tools ----------------
  - name: create_group_room
    description: >
      Tạo Text Channel riêng tư trên Discord cho nhóm. Chỉ thành viên trong nhóm mới thấy.

      CÁCH DÙNG: Gọi 1 lần với member_ids — tool tự resolve ID hoặc tên.
      ⚠️ ƯU TIÊN @mention: yêu cầu leader @mention từng thành viên (gõ @ rồi chọn tên).
      @mention chứa Discord ID chính xác → 100% resolve được, không bao giờ sai.
      Chỉ dùng tên thường nếu leader không thể @mention (vd: copy text từ nơi khác).

      XỬ LÝ KẾT QUẢ:
      - success → báo: "Đã tạo phòng #xxx cho {members}. Giờ bàn phân công vai trò nhé."
      - empty + INVALID_MEMBERS → đọc failed_members (có hint). Báo: "Không tìm thấy {tên}.
        Bạn @mention họ (gõ @ rồi chọn tên) để mình thêm chính xác nhé."
        ĐỢI leader sửa → gọi lại tool.
    parameters:
      type: object
      properties:
        room_name:
          type: string
          description: "Tên room chat cần tạo."
        member_ids:
          type: array
          items: {type: string}
          description: "Danh sách Discord User ID hoặc tên hiển thị/username của các thành viên (ví dụ: ['910523601546014742', 'Duy', 'Thien'] - hãy truyền tên nếu không biết ID số, tuyệt đối không tự đoán ID số)."
        is_private:
          type: boolean
          default: true
          description: "Quyền riêng tư của room (mặc định true)."
      required: [room_name, member_ids]

  # ---------------- Task Management Tools ----------------
  - name: generate_group_plan
    description: >
      Tạo kế hoạch CHI TIẾT cho nhóm — dạng guidebook với: việc cần làm, brainstorm, file tham khảo cụ thể, deliverable.
      group_id được auto-resolve từ Discord context (chỉ dùng được trong group room).

      Gọi SAU KHI nhóm đã thống nhất ai làm vai trò gì.
      ⚠️ Leader @mention thành viên → AI tự điền user_id. Nếu không @mention, agent tự identify từ members list trong context.
      ⚠️ QUAN TRỌNG: Tool trả về `summary` (Markdown guidebook) và `members_plan` (chi tiết từng người).
      Agent PHẢI hiển thị ĐẦY ĐỦ nội dung `summary`, KHÔNG ĐƯỢC rút gọn hay tóm tắt.
      Đây là guidebook để learner làm theo — thiếu chi tiết là mất tính thực tiễn.
    parameters:
      type: object
      properties:
        lab_id:
          type: string
          description: "Mã bài lab (có thể để trống để auto-resolve từ ngày hôm nay, context đã có)."
        members:
          type: array
          description: "Danh sách thành viên kèm vai trò. user_id từ @mention hoặc context."
          items:
            type: object
            properties:
              user_id:
                type: string
                description: "ID học viên — leader @mention thì agent lấy từ mention, nếu không agent tự identify từ members list trong context."
              role:
                type: string
                description: "Vai trò trong nhóm (ví dụ: Frontend, Backend, AI, PM, QA, Fullstack)."
              custom_tasks:
                type: array
                items: {type: string}
                description: "Danh sách task cụ thể cho member này (tùy chọn)."
            required: [user_id, role]
        notes:
          type: string
          description: "Ghi chú thêm từ nhóm (ví dụ: công nghệ sử dụng, hướng tiếp cận) — tùy chọn."
      required: [lab_id, members]

  - name: get_group_plan
    description: >
      Đọc kế hoạch hiện tại của nhóm từ DB.
      group_id được auto-resolve từ Discord context (chỉ dùng được trong group room).
      Không cần tham số — code tự biết đang ở nhóm nào.
    parameters:
      type: object
      properties: {}

  - name: track_group_progress
    description: >
      Xem tiến độ làm lab của nhóm. Trả về % hoàn thành tổng thể,
      progress bar trực quan, danh sách từng thành viên và trạng thái task.
      group_id được auto-resolve từ Discord context (chỉ dùng được trong group room).
      Nếu team chưa chốt plan → báo "chưa chốt kế hoạch".
    parameters:
      type: object
      properties: {}

  - name: update_group_progress
    description: >
      Cập nhật tiến độ của một thành viên trong nhóm dựa trên task_id từ plan.
      group_id + user_id được auto-resolve từ Discord context.
      Nếu status=completed, tự động đánh dấu toàn bộ checklist hoàn thành.
      Trả về overall_team_progress_pct sau mỗi lần cập nhật.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: "Mã task cần cập nhật (ví dụ: 'T1', 'T2', 'CT1')."
        status:
          type: string
          enum: [in_progress, completed]
          description: "Trạng thái mới của task (tùy chọn). completed → auto full checklist."
        completed_checklist:
          type: integer
          description: "Số checklist đã hoàn thành (tùy chọn)."
      required: [task_id]

  - name: list_members
    description: >
      Liệt kê danh sách thành viên trong group room hiện tại (kèm id + tên).
      Chỉ dùng được trong group room.
      Dùng tool này KHI leader không @mention thành viên — agent tự identify ai là ai dựa vào tên.
      Agent có thể dùng ID từ kết quả để truyền vào generate_group_plan.
    parameters:
      type: object
      properties: {}

  # ---------------- Troubleshooting Tools ----------------
  - name: analyze_student_issue
    description: >
      Tiếp nhận mô tả sự cố/log lỗi của học viên, phân tích nguyên nhân gốc rễ và gợi ý giải pháp.
      user_id được auto-resolve từ Discord context.
      Nếu log không rõ ràng hoặc không có trong tài liệu, Bot PHẢI yêu cầu dán log hoặc báo chưa rõ,
      KHÔNG ĐƯỢC TỰ BỊA LỖI.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: "Mã task đang thực hiện."
        issue_description:
          type: string
          description: "Mô tả lỗi hoặc câu hỏi của học viên (tối thiểu 10 ký tự)."
        error_log:
          type: string
          description: "Đoạn log lỗi từ Terminal / IDE (tùy chọn)."
      required: [task_id, issue_description]
