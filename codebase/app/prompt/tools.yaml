# starter_v0 — tool declarations for Labcode Assistant Agent
# Tool names must stay in sync across:
#   this file -> tools/__init__.py (ALL_TOOLS) -> test_tools.py

tools:
  # ---------------- Knowledge & Content Tools ----------------
  - name: get_lab_content
    description: >
      Lấy nội dung bài lab đã được Admin phân tích từ cache (kết quả clone repo + phân tích .md).
      Trả về mục tiêu bài lab (lab_objective), danh sách task, tiêu chí đánh giá (grading_rubrics),
      bẫy lỗi thường gặp (common_pitfalls), và danh sách tài liệu .md (sitemap).
      Gọi tool này SAU KHI đã có lab_id từ get_user_context.
    parameters:
      type: object
      properties:
        lab_id:
          type: string
          description: "Mã bài lab cần lấy nội dung (ví dụ: 'DAY05', 'LAB05_GROUP')."
      required: [lab_id]

  # ---------------- Platform & Context Tools ----------------
  - name: get_user_context
    description: >
      Lấy thông tin chi tiết về người dùng, lịch làm lab trong ngày (tự động tra theo lab_date),
      vai trò và thông tin nhóm từ CSDL SQLite `users`.
      Sử dụng đầu tiên khi nhận diện câu hỏi từ học viên để xác định vai trò và bài lab hôm nay.
    parameters:
      type: object
      properties:
        user_id:
          type: string
          description: "ID người dùng trên hệ thống chat (Slack/Discord/LMS)."
        date:
          type: string
          description: "Ngày làm lab (định dạng YYYY-MM-DD, tùy chọn, mặc định là hôm nay)."
      required: [user_id]

  - name: create_group_room
    description: >
      Tạo Text Channel riêng tư trên Discord cho nhóm. Chỉ thành viên trong nhóm mới thấy.

      CÁCH DÙNG: Gọi 1 lần với member_ids — tool tự resolve ID hoặc tên.
      ⚠️ ƯU TIÊN @mention: yêu cầu leader @mention từng thành viên (gõ @ rồi chọn tên).
      @mention chứa Discord ID chính xác → 100% resolve được, không bao giờ sai.
      Chỉ dùng tên thường nếu leader không thể @mention (vd: copy text từ nơi khác).

      XỬ LÝ KẾT QUẢ:
      - success → báo: "Đã tạo phòng #xxx cho {members}. Giờ bàn phân công vai trò nhé."
      - empty + INVALID_MEMBERS → đọc failed_members (có hint). Báo: "Không tìm thấy {tên}.
        Bạn @mention họ (gõ @ rồi chọn tên) để mình thêm chính xác nhé."
        ĐỢI leader sửa → gọi lại tool.
    parameters:
      type: object
      properties:
        room_name:
          type: string
          description: "Tên room chat cần tạo."
        member_ids:
          type: array
          items: {type: string}
          description: "Danh sách Discord User ID hoặc tên hiển thị/username của các thành viên (ví dụ: ['910523601546014742', 'Duy', 'Thien'] - hãy truyền tên nếu không biết ID số, tuyệt đối không tự đoán ID số)."
        is_private:
          type: boolean
          default: true
          description: "Quyền riêng tư của room (mặc định true)."
      required: [room_name, member_ids]

  # ---------------- Task Management Tools ----------------
  - name: generate_group_plan
    description: >
      Tạo kế hoạch chi tiết cho một nhóm làm lab dựa trên draft plan (từ cache) kết hợp
      với vai trò và task cụ thể của từng thành viên do nhóm trưởng cung cấp.
      Gọi tool này SAU KHI nhóm đã thống nhất ai làm vai trò gì.
      Kết quả trả về plan có phases, task cho từng người và được lưu vào DB.
    parameters:
      type: object
      properties:
        lab_id:
          type: string
          description: "Mã bài lab."
        group_id:
          type: string
          description: "Mã nhóm."
        members:
          type: array
          description: "Danh sách thành viên kèm vai trò và task."
          items:
            type: object
            properties:
              user_id:
                type: string
                description: "ID học viên."
              role:
                type: string
                description: "Vai trò trong nhóm (ví dụ: Frontend, Backend, PM)."
              custom_tasks:
                type: array
                items: {type: string}
                description: "Danh sách task cụ thể cho member này (tùy chọn)."
            required: [user_id, role]
        notes:
          type: string
          description: "Ghi chú thêm từ nhóm (ví dụ: công nghệ sử dụng, hướng tiếp cận) — tùy chọn."
      required: [lab_id, group_id, members]

  - name: get_group_plan
    description: >
      Đọc kế hoạch hiện tại của một nhóm từ DB.
      Trả về plan chi tiết (phases, members, tasks, objective) nếu đã được tạo.
      Gọi tool này khi cần xem lại plan đã tạo trước đó.
    parameters:
      type: object
      properties:
        group_id:
          type: string
          description: "Mã nhóm cần lấy plan."
      required: [group_id]

  - name: track_group_progress
    description: >
      Xem tiến độ làm lab của nhóm. Trả về % hoàn thành tổng thể,
      danh sách từng thành viên và trạng thái task (completed/in_progress).
      Sử dụng khi học viên hoặc nhóm trưởng hỏi về tiến độ.
    parameters:
      type: object
      properties:
        group_id:
          type: string
          description: "Mã nhóm cần kiểm tra tiến độ."
      required: [group_id]

  - name: update_group_progress
    description: >
      Cập nhật tiến độ làm lab của một thành viên trong nhóm.
      Dùng để đánh dấu task hoàn thành hoặc cập nhật số checklist đã làm.
      Trả về trạng thái mới nhất sau khi cập nhật.
    parameters:
      type: object
      properties:
        group_id:
          type: string
          description: "Mã nhóm."
        user_id:
          type: string
          description: "Mã học viên cần cập nhật."
        task_id:
          type: string
          description: "Mã task cần cập nhật (ví dụ: 'T1', 'T2')."
        status:
          type: string
          enum: [in_progress, completed]
          description: "Trạng thái mới của task (tùy chọn)."
        completed_checklist:
          type: integer
          description: "Số checklist đã hoàn thành (tùy chọn)."
      required: [group_id, user_id, task_id]

  # ---------------- Troubleshooting Tools ----------------
  - name: analyze_student_issue
    description: >
      Tiếp nhận mô tả sự cố/log lỗi của học viên, phân tích nguyên nhân gốc rễ và gợi ý giải pháp.
      Nếu log không rõ ràng hoặc không có trong tài liệu, Bot PHẢI yêu cầu dán log hoặc báo chưa rõ,
      KHÔNG ĐƯỢC TỰ BỊA LỖI.
    parameters:
      type: object
      properties:
        user_id:
          type: string
          description: "Mã học viên báo lỗi."
        task_id:
          type: string
          description: "Mã task đang thực hiện."
        issue_description:
          type: string
          description: "Mô tả lỗi hoặc câu hỏi của học viên (tối thiểu 10 ký tự)."
        error_log:
          type: string
          description: "Đoạn log lỗi từ Terminal / IDE (tùy chọn)."
      required: [user_id, task_id, issue_description]
